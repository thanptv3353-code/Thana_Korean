<!doctype html><html lang="lo"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THANA KOREAN · Management</title><link rel="stylesheet" href="/static/hub.css"><style>.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:15px}.metrics strong{font-size:32px;display:block}textarea{width:100%;min-height:100px;font:inherit}button{margin:5px}.actions{display:flex;flex-wrap:wrap;gap:12px}#accounts article,#payments article{overflow-wrap:anywhere}select{max-width:230px}button[aria-pressed="true"]{background:#143d36;color:white;outline:2px solid #bc943e}</style></head><body><header><a href="/" class="logo">THANA KOREAN</a><a href="/account">ບັນຊີ / 계정</a></header><main><h1>ຈັດການລະບົບ / 관리</h1><p id="user"></p><div class="metrics" id="metrics"></div><section id="trend"></section><div class="actions"><a class="primary" href="/editor">ຫຼັກສູດ / 강좌</a><a class="primary" href="/vocabulary-studio">ຄຳສັບ–ສຽງ / 단어·음성</a><a class="primary" href="/media-studio">ສື່ / 미디어</a><a id="legacyAdminLink" href="/legacy-admin" hidden>ບົດຮຽນເກົ່າ / 기존 관리</a><a href="/studio">EPS Review</a><a href="/question-editor">ຄັງຂໍ້ສອບ / 문제 은행</a></div><details><summary>ກວດຊຸມຊົນ / 커뮤니티 검토</summary><div id="moderation"></div></details><section id="adminOnly" hidden><p><a href="/api/admin/backup">⬇ ສຳຮອງທັງລະບົບ / 전체 백업</a></p><details><summary>ບັນຊີ ແລະ ສິດ / 계정 및 권한</summary><div class="actions"><label>ຄົ້ນຫາບັນຊີ / 계정 검색<input id="accountSearch" type="search" placeholder="ຊື່ ຫຼື username / 이름 또는 아이디"></label><label>ສະຖານະ / 상태<select id="accountState"><option value="">ທັງໝົດ / 전체</option><option value="pending">ລໍຖ້າ / 대기</option><option value="approved">ອະນຸມັດ / 승인</option><option value="rejected">ປະຕິເສດ / 거절</option></select></label></div><p id="accountCount" role="status"></p><div id="accounts"></div></details><details><summary>Premium ແລະ ການຊຳລະ / 결제</summary><article><label>ລາຄາ / 가격<input id="amount" type="number" min="0"></label><label>ສະກຸນເງິນ<select id="currency"><option>LAK</option><option>KRW</option></select></label><label>ຈຳນວນມື້<input id="days" type="number" min="1" max="366"></label><label>ຄຳແນະນຳໂອນເງິນ<textarea id="instructions"></textarea></label><label><input id="enabled" type="checkbox"> ເປີດຮັບຫຼັກຖານ / 영수증 접수</label><button id="savePlan">ບັນທຶກ</button></article><div id="payments"></div></details><details><summary>ຫຼັກສູດ Free/Premium</summary><div id="courseAccess"></div></details><details><summary>ປະຫວັດຈັດການ / 관리 기록</summary><div id="audit"></div></details></section><p id="message" role="status"></p></main><script src="/static/management.js"></script></body></html>
