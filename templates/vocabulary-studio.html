<!doctype html><html lang="lo"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THANA KOREAN · Vocabulary Studio</title><link rel="stylesheet" href="/static/hub.css"><style>textarea{width:100%;min-height:120px;padding:12px;font:inherit}button{margin:5px}</style></head><body><header><a href="/" class="logo">THANA KOREAN</a><a href="/admin">← Admin</a></header><main><h1>ຈັດການຄຳສັບ / 단어 관리</h1><label>ເລືອກຄຳສັບ <select id="select"></select></label><button id="new">＋ ຄຳໃໝ່</button><article><label>한국어<input id="ko"></label><label>ລາວ<input id="lo"></label><label>ໝວດ<input id="category"></label><label>ປະເພດຄຳ / 품사<input id="part_of_speech" maxlength="80" placeholder="ຄຳນາມ / 명사"></label><label>ຮູບຈາກຄັງສື່ / 이미지<select id="image_url"><option value="">ບໍ່ໃຊ້ຮູບ / 없음</option></select></label><p><a href="/media-studio" target="_blank" rel="noopener">ອັບໂຫຼດຮູບ / 이미지 업로드</a> <button id="reloadImages" type="button">ໂຫຼດຮູບຄືນ / 새로고침</button></p><img id="wordImage" alt="ຮູບຄຳສັບ / 단어 이미지" style="max-width:100%;max-height:220px" hidden><label>ປະໂຫຍກເກົາຫຼີ<input id="example_ko"></label><label>ປະໂຫຍກລາວ<input id="example_lo"></label><label><input id="published" type="checkbox"> ເຜີຍແຜ່ / 공개</label><button id="save" class="primary">ບັນທຶກ</button><h3>ສຽງເຈົ້າຂອງພາສາ / 원어민 음성</h3><label>ພາສາ<select id="audioLanguage"><option value="ko">한국어</option><option value="lo">ລາວ</option></select></label><label>MP3 / WAV · ≤10 MB<input type="file" id="audioFile" accept="audio/mpeg,audio/wav"></label><button id="upload">ອັບໂຫຼດສຽງ</button><div id="audioPreview"></div></article><details><summary>ນຳເຂົ້າ CSV</summary><article><p>ຖັນ: ko,lo,category,example_ko,example_lo,part_of_speech,image_url. ຄຳທີ່ນຳເຂົ້າຈະເປັນຮ່າງກ່ອນ.</p><label>CSV<input id="csvFile" type="file" accept=".csv,text/csv"></label><textarea id="csv" placeholder="ko,lo,category&#10;안녕하세요,ສະບາຍດີ,ທັກທາຍ"></textarea><button id="preview">ກວດກ່ອນນຳເຂົ້າ</button><button id="import" disabled>ນຳເຂົ້າຮ່າງ</button><pre id="importResult" style="white-space:pre-wrap"></pre></article></details><p id="message" role="status"></p></main><script src="/static/vocabulary-studio.js"></script></body></html>
