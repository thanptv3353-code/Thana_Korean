<!doctype html><html lang="lo"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THANA KOREAN · Question Bank</title><link rel="stylesheet" href="/static/hub.css"><style>textarea{width:100%;min-height:100px;padding:12px;font:inherit}</style></head><body><header><a href="/management">← ຈັດການ / 관리</a><span class="logo">THANA KOREAN</span></header><main><h1>ຄັງຂໍ້ສອບ / 문제 은행</h1><label>ຄຳຖາມ<select id="select"></select></label><button id="new">＋ ຄຳຖາມໃໝ່</button><article><label>ໝວດ<select id="category"><option>img_word</option><option>blank</option><option>sign</option><option>qa</option><option>reading</option></select></label><label>ປະເພດ<select id="type"><option>text</option><option>image_stem</option><option>image_choices</option></select></label><label>ກຸ່ມບົດອ່ານ (ກຸ່ມດຽວໃຊ້ຊື່ດຽວກັນ)<input id="source"></label><label>ຮູບ (ໃຊ້ລິ້ງຈາກຄັງສື່ ຫຼື ຊື່ຮູບເກົ່າ)<input id="image"></label><label>ຄຳຖາມເກົາຫຼີ<textarea id="stem_ko"></textarea></label><label>ຄຳຖາມລາວ<textarea id="stem_lo"></textarea></label><label>ບົດອ່ານເກົາຫຼີ<textarea id="passage_ko"></textarea></label><label>ບົດອ່ານລາວ<textarea id="passage_lo"></textarea></label><label>ຕົວເລືອກເກົາຫຼີ (ແຖວລະໜຶ່ງ)<textarea id="choices_ko"></textarea></label><label>ຕົວເລືອກລາວ (ຈຳນວນແຖວເທົ່າກັນ)<textarea id="choices_lo"></textarea></label><label>ຄຳຕອບຖືກ (ເລີ່ມ 1)<input id="answer" type="number" min="1" max="6"></label><label><input id="verified" type="checkbox"> ກວດທານແລ້ວ</label><label><input id="active" type="checkbox"> ເປີດໃຊ້ຄຳຖາມ</label><button id="save">ບັນທຶກ</button></article><p id="message" role="status"></p></main><script src="/static/question-editor.js"></script></body></html>
