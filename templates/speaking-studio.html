<!doctype html><html lang="lo"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THANA KOREAN · Speaking Studio</title><link rel="stylesheet" href="/static/hub.css"></head><body><header><a href="/management">← ຈັດການ / 관리</a><span class="logo">THANA KOREAN</span></header><main><h1>ບົດຝຶກເວົ້າ / 말하기 과제</h1><p>ເຜີຍແຜ່ສຽງຕົວຢ່າງກ່ອນເຜີຍແຜ່ບົດຝຶກ. ການຝຶກແລ້ວບໍ່ແມ່ນຄະແນນອອກສຽງ. / 예시 음성을 먼저 공개하세요. 연습 완료는 발음 점수가 아닙니다.</p><label>ບົດຝຶກ / 과제<select id="exercise"></select></label><button id="new">+ ໃໝ່ / 새 과제</button><article><label>ຊື່ / 제목<input id="title" maxlength="200"></label><label>ພາສາ / 언어<select id="language"><option value="ko">한국어</option><option value="lo">ລາວ</option></select></label><label>ລະດັບ / 수준<select id="level"><option value="beginner">ເລີ່ມຕົ້ນ / 초급</option><option value="intermediate">ກາງ / 중급</option><option value="advanced">ສູງ / 고급</option></select></label><label>ປະໂຫຍກຝຶກ / 연습 문장<textarea id="reference" maxlength="500" rows="3" style="width:100%;font:inherit"></textarea></label><label>ຄຳແປ / 번역<textarea id="translation" maxlength="1000" rows="3" style="width:100%;font:inherit"></textarea></label><label>ສຽງຕົວຢ່າງ / 예시 음성<select id="sample"></select></label><audio id="preview" controls preload="none" hidden></audio><p><a href="/media-studio">ອັບໂຫຼດສຽງ / 음성 업로드</a> · <button id="refreshAudio">ໂຫຼດສຽງໃໝ່ / 음성 새로고침</button></p><label><input id="published" type="checkbox"> ເຜີຍແຜ່ / 공개</label><button id="save">ບັນທຶກ / 저장</button></article><p id="message" role="status"></p></main><script src="/static/speaking-studio.js"></script></body></html>
